[workspace]
resolver = "3"
members = ["crates/eave-notify", "plugins/notifications"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eaveshell/eave-notifications"

[workspace.dependencies]
# From crates.io. When eave-build compiles the plugin into a bar, it patches eave-api to the eave
# it builds, so the host and the plugin share one.
eave-api = "0.1.7"
eave-notify = { path = "crates/eave-notify", version = "0.3.0" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
